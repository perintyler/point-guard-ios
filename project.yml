name: PointGuard
options:
  bundleIdPrefix: rocks.barry.pointguard
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  PointGuard:
    type: application
    platform: iOS
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Point Guard
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # The device path is real HTTPS with a real Let's Encrypt certificate,
        # so no ATS exception is needed for it. The one remaining plain-HTTP
        # caller is the SIMULATOR, which talks to point-guard on 127.0.0.1:3868 —
        # `NSAllowsLocalNetworking` permits exactly that and nothing routable.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: rocks.barry.pointguard.app
  PointGuardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: PointGuard
schemes:
  PointGuard:
    build:
      targets:
        PointGuard: all
        PointGuardTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # The live tests need the real BARRY_SECRET, and xcodebuild does not pass
      # the invoking shell's environment through to the test process. Without
      # this they XCTSkip on every run — which reads identically to a pass, so
      # the suite would report green while never touching the service. Expands
      # from the environment at launch; unset, the tests skip as before.
      environmentVariables:
        BARRY_SECRET: $(BARRY_SECRET)
      targets:
        - PointGuardTests
